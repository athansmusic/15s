<body>
<main>
  <a href="/"><img class="art" src="/img/logo.png" width="72" height="72" alt="15 Second Mysteries"></a>
  <h1>404: not found</h1>

  <p class="count" id="c">15</p>

<script>var n=15,el=document.getElementById("c");var t=setInterval(function(){n--;el.textContent=n;if(n===0){clearInterval(t);el.style.fontSize="20px";el.textContent="they did not find it";}},1000);</script>
