<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15 Second Mysteries</title>
<meta name="description" content="15 Second Mysteries: a fiction anthology podcast where every episode is a complete mystery in exactly fifteen seconds. A new one every day.">
<meta property="og:title" content="15 Second Mysteries">
<meta property="og:description" content="A podcast. Each episode is 15 seconds.">
<meta property="og:image" content="img/logo-og.jpg">
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="style.css"><script src="episodes.js"></script>
</head>
<body>
<main>
  <img class="art" src="img/logo.png" width="72" height="72" alt="15 Second Mysteries show art">
  <h1>15 Second Mysteries</h1>
  <p class="dim">A podcast. Each episode is 15 seconds.</p>

  <h2>Today's episode</h2>
  <div class="ep" id="ep">none yet</div>

  <h2>Listen</h2>
  <p class="links" id="links"></p>

  <h2>Snake</h2>
  <p class="dim">Eat 15 in 15 seconds.</p>
  <canvas id="snake" width="300" height="300"></canvas>
  <p class="hud"><span>score: <span id="snake-score">0</span></span> <button id="snake-start">play</button></p>
</main>
<script>
(function () {
  function esc(s) { return String(s || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var t = new Date(), today = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
  var out = (window.EPISODES || []).filter(function (e) { return e.date <= today; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0];
  var total = (window.SITE || {}).seasonEpisodes;
  function niceDate(iso) { var p = iso.split("-"), m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]; return m[+p[1] - 1] + " " + (+p[2]); }
  if (out) document.getElementById("ep").innerHTML = "<strong>" + esc(out.title) + '</strong><span class="no">No. ' + esc(out.n) + (total ? " of " + esc(total) : "") + " &middot; " + esc(niceDate(out.date)) + "</span>"
    + (out.blurb ? '<span class="blurb">' + esc(out.blurb) + "</span>" : "")
    + (out.src ? '<a class="btn" href="' + esc(out.src) + '">Listen</a>' : "");
  var L = window.LINKS || {}, names = { spotify: "Spotify", apple: "Apple Podcasts", youtube: "YouTube", rss: "RSS", kickstarter: "Kickstarter" }, parts = [];
  for (var k in names) if (L[k]) parts.push('<a href="' + esc(L[k]) + '">' + names[k] + "</a>");
  document.getElementById("links").innerHTML = parts.length ? parts.join("") : "coming soon";
})();
</script>
<script src="snake.js"></script>
<script src="bgm.js"></script>
</body>
</html>
